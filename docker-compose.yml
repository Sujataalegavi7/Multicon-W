services:
  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: crr_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-crr_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-crr_secure_password_2026}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-crr_db}
    volumes:
      - mongo_data:/data/db
    networks:
      - crr_network

  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crr_backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-crr_admin}:${MONGO_INITDB_ROOT_PASSWORD:-crr_secure_password_2026}@mongodb:27017/${MONGO_INITDB_DATABASE:-crr_db}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_very_long_secure_random_key_here}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID:-crr_admin}
      ADMIN_CODE: ${ADMIN_CODE:-Admin@CRR2026}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - crr_network

  # React Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: crr_frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - crr_network

volumes:
  mongo_data:
  backend_uploads:

networks:
  crr_network:
    driver: bridge
